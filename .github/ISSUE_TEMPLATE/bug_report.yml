name: Bug report
description: Report a problem with SearchMob
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SearchMob version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Android version / OEM
      placeholder: e.g. Pixel 7, Android 15 / or Samsung S23, One UI 6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Relevant logcat output. Please redact anything sensitive — do NOT paste search queries you want kept private.
