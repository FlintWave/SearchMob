name: release

# Build, sign, checksum and publish the release APK. Triggered ONLY when a GitHub Release is
# published (release-please creates these on merge of its release PR) or when a v* tag is pushed.
# Signing secrets are therefore never exposed on ordinary pushes or pull requests.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# Read-only by default; the publish job elevates to contents: write to attach assets to the Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    name: Assemble, sign, checksum, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_BASE64:-}" ]; then
            echo "::error::SIGNING_KEY_BASE64 secret is not set; cannot produce a signed release."
            echo "Configure the SIGNING_KEY_BASE64/KEY_ALIAS/KEY_STORE_PASSWORD/KEY_PASSWORD secrets."
            exit 1
          fi
          # Decode only into the ephemeral runner workspace; never written to the repo tree under VCS.
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK found under app/build/outputs/apk/release."
            exit 1
          fi
          echo "Found signed APK: $apk"
          build_tools_dir="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n1)"
          "${build_tools_dir}/apksigner" verify --print-certs "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Stage release artifacts and generate SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          dest="dist/searchmob-${version}.apk"
          cp "$APK_PATH" "$dest"
          # Checksums are computed over the staged filenames so they match the published asset names.
          ( cd dist && sha256sum -- *.apk > SHA256SUMS )
          echo "Published artifacts:"
          cat dist/SHA256SUMS

      - name: Publish APK + SHA256SUMS to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          fail_on_unmatched_files: true
