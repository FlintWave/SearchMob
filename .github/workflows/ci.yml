name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default. Third-party actions are pinned by commit SHA (supply-chain hardening).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, assemble (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: ktlint, Android Lint, unit tests, debug assembly
        run: ./gradlew ktlintCheck lint test assembleDebug --stacktrace
# Release signing, APK/AAB artifacts, F-Droid metadata and release-please are added in the
# add-ci-cd-releases phase. This skeleton only proves the project builds and tests green.
