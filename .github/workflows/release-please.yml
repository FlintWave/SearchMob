name: release-please

# Conventional-Commits-driven versioning + changelog. On pushes to main, release-please opens or
# updates a release PR (bumping versionName in app/build.gradle.kts via the x-release-please-version
# annotation, and the CHANGELOG). Merging that PR creates the git tag and the GitHub Release, which
# in turn triggers the build/sign/publish pipeline in release.yml.

# Manual for now. Automatic release PRs on every push require the repo setting "Allow GitHub Actions
# to create and approve pull requests" (Settings → Actions → General). Also, SearchMob uses
# Ubuntu-style date versions (YY.MM.VV) which are not strict SemVer, so release-please's auto-bump is
# not relied upon — versions are set manually. Re-enable `on: push: [main]` if that changes.
on:
  workflow_dispatch:

# Least-privilege: only the scopes release-please needs to open the release PR and create releases.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
