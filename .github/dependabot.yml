version: 2
updates:
  # Third-party GitHub Actions (SHA-pinned). Grouped into a single PR to keep noise down.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Gradle build + app dependencies. MAJOR bumps of build tooling/libraries (AGP, Kotlin, Gradle,
  # Compose BOM, Ktor, OkHttp, …) need manual migration and break an unattended build, so do NOT
  # auto-open PRs for them; minor/patch updates are grouped into a single PR.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies
      - gradle
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
