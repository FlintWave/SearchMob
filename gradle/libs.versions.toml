[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycleRuntimeKtx = "2.8.7"
composeBom = "2024.12.01"
junit = "4.13.2"
junitExt = "1.2.1"
espressoCore = "3.6.1"
ktlintPlugin = "12.1.1"
coroutines = "1.9.0"
ktor = "3.0.3"
okhttp = "4.12.0"
jsoup = "1.18.3"
